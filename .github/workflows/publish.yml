name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build:all

      - name: Publish workspace packages
        run: |
          npm publish -w @instollar-dev/tokens --access restricted
          npm publish -w @instollar-dev/tailwind-preset --access restricted
          npm publish -w @instollar-dev/icons --access restricted
          npm publish -w @instollar-dev/ui-web --access restricted
          npm publish -w @instollar-dev/ui-native --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish core SDK
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
